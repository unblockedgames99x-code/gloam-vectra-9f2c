<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <title>NEO OS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: #07090d; }
      body { overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #neo { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #07090d; }
      .runner-controls {
        position: fixed;
        z-index: 10;
        top: max(14px, env(safe-area-inset-top));
        left: 50%;
        display: flex;
        align-items: center;
        gap: 8px;
        width: max-content;
        max-width: calc(100vw - 28px);
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 15px;
        background: rgba(13, 17, 25, .76);
        box-shadow: 0 16px 44px rgba(0, 0, 0, .35);
        backdrop-filter: blur(18px);
        transform: translateX(-50%);
      }
      button {
        min-height: 36px;
        border: 0;
        border-radius: 10px;
        padding: 0 13px;
        color: #ffffff;
        background: linear-gradient(135deg, #546dff, #8b48e8);
        font: 700 13px/1 inherit;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.12); }
      button:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
      button:disabled { cursor: wait; opacity: .58; }
      #fullscreen { background: rgba(255, 255, 255, .12); }
      #status { max-width: 130px; overflow: hidden; color: rgba(255, 255, 255, .72); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      :fullscreen .runner-controls, :-webkit-full-screen .runner-controls { opacity: 0; pointer-events: none; }
      @media (max-width: 560px) {
        .runner-controls { gap: 6px; padding: 6px; }
        button { min-height: 34px; padding: 0 9px; font-size: 12px; }
        #status { display: none; }
      }
    </style>
  </head>
  <body>
    <iframe id="neo" title="NEO OS" allow="autoplay; clipboard-read; clipboard-write; fullscreen; gamepad" allowfullscreen></iframe>
    <div class="runner-controls" aria-label="NEO OS controls">
      <button id="about-blank" type="button" disabled>Open in about:blank</button>
      <button id="fullscreen" type="button" disabled>Full screen</button>
      <span id="status" role="status">Starting NEO…</span>
    </div>

    <script>
      // Public jsDelivr sources. The first available source is used.
      const u = "unblockedgames99x-code";
      const r = "gloam-vectra-9f2c";
      const b = "main";
      const p = "neo-os/index.html";
      const f = "";

      const urls = [
        `https://cdn.jsdelivr.net/gh/${u}/${r}@${b}/${p}${f}`,
        `https://fastly.jsdelivr.net/gh/${u}/${r}@${b}/${p}${f}`,
        `https://quantil.jsdelivr.net/gh/${u}/${r}@${b}/${p}${f}`,
        `https://originfastly.jsdelivr.net/gh/${u}/${r}@${b}/${p}${f}`,
        `https://gcore.jsdelivr.net/gh/${u}/${r}@${b}/${p}${f}`
      ];

      const frame = document.getElementById("neo");
      const status = document.getElementById("status");
      const blankButton = document.getElementById("about-blank");
      const fullscreenButton = document.getElementById("fullscreen");
      let sourceUrl = urls[0];
      let frameReady = false;

      async function sourceIsAvailable(url) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5500);
        try {
          const response = await fetch(url, {
            method: "HEAD",
            cache: "no-store",
            mode: "cors",
            signal: controller.signal
          });
          return response.ok;
        } catch (error) {
          return false;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function chooseSource() {
        const results = await Promise.all(urls.map(async (url) => ({ url, available: await sourceIsAvailable(url) })));
        return results.find((result) => result.available)?.url || urls[0];
      }

      function htmlEscape(value) {
        return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      }

      async function enterFullscreen(target = document.documentElement) {
        if (!document.fullscreenEnabled || !target.requestFullscreen) return false;
        try {
          await target.requestFullscreen({ navigationUI: "hide" });
          return true;
        } catch (error) {
          return false;
        }
      }

      async function openInAboutBlank() {
        // This stays an about:blank tab, while NEO itself loads from HTTPS/CDN.
        const tab = window.open("about:blank", "_blank");
        if (!tab) {
          status.textContent = "Allow pop-ups, then try again.";
          return;
        }
        const safeUrl = htmlEscape(sourceUrl);
        tab.document.open();
        tab.document.write(
          "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><title>NEO OS</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07090d}iframe{display:block;width:100%;height:100%;border:0;background:#07090d}</style></head><body><iframe title=\"NEO OS\" allow=\"autoplay; clipboard-read; clipboard-write; fullscreen; gamepad\" allowfullscreen src=\"" + safeUrl + "\"></iframe></body></html>"
        );
        tab.document.close();
        tab.focus();
        try {
          await tab.document.documentElement.requestFullscreen({ navigationUI: "hide" });
        } catch (error) {
          // A browser may require another direct click before allowing a popup to go fullscreen.
        }
      }

      blankButton.addEventListener("click", openInAboutBlank);
      fullscreenButton.addEventListener("click", async () => {
        const active = document.fullscreenElement;
        if (active) {
          await document.exitFullscreen();
          return;
        }
        if (!(await enterFullscreen())) status.textContent = "Fullscreen is blocked by this runner.";
      });

      frame.addEventListener("load", () => {
        frameReady = true;
        status.textContent = "NEO is ready";
      });

      (async () => {
        frame.src = sourceUrl;
        blankButton.disabled = false;
        fullscreenButton.disabled = false;
        const selectedUrl = await chooseSource();
        if (!frameReady && selectedUrl !== sourceUrl) {
          sourceUrl = selectedUrl;
          status.textContent = "Trying another jsDelivr source…";
          frame.src = sourceUrl;
        }
      })();
    </script>
  </body>
</html>
