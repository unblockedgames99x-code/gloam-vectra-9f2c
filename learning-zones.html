        try {

          if (path === "/" && localStorage.getItem("ugp_token")) {

    <script>
      (function () {
        if (window.learningZonesSaveCommit) return;
        window.learningZonesSaveCommit = function (url, init) {
          init = init || {};
          if (typeof Worker !== "function" || typeof Blob !== "function" || !window.URL || !URL.createObjectURL) {
            return fetch(url, init);
          }
          var code = "self.onmessage=async function(event){try{var response=await fetch(event.data.url,event.data.init||{});self.postMessage({ok:response.ok,status:response.status,statusText:response.statusText});}catch(error){self.postMessage({ok:false,status:0,statusText:String(error&&error.message||error)});}};";
          var blobUrl = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
          return new Promise(function (resolve, reject) {
            var worker = new Worker(blobUrl);
            var timer = setTimeout(function () {
              worker.terminate();
              URL.revokeObjectURL(blobUrl);
              reject(new Error("save_timeout"));
            }, 10000);
            worker.onmessage = function (event) {
              clearTimeout(timer);
              worker.terminate();
              URL.revokeObjectURL(blobUrl);
              var result = event.data || {};
              if (result.ok) resolve(result);
              else reject(new Error(result.statusText || "Could not update saved zones."));
            };
            worker.onerror = function (error) {
              clearTimeout(timer);
              worker.terminate();
              URL.revokeObjectURL(blobUrl);
              reject(error instanceof Error ? error : new Error("save_worker_error"));
            };
            worker.postMessage({ url: url, init: init });
          });
        };
      })();
    </script>

    <script>
      (function () {
        function loadScript(src) {
          var script = document.createElement("script");
          script.src = src;
          script.async = true;
          document.head.appendChild(script);
        }

        function loadHelpers() {
          if (window.__learningZonesHelpersLoaded) return;
          window.__learningZonesHelpersLoaded = true;
          loadScript("/chat-site-sync.js?v=20260724-savefeedback2");
          loadScript("/report-bug-link.js?v=20260723-page3");
        }
        window.learningZonesLoadHelpers = loadHelpers;

        function scheduleHelpers() {
          var path = location.pathname.replace(/\/+$/, "") || "/";
          if (path === "/login") return;
          var isInteractionCritical =
            path === "/chat" ||
            path === "/settings" ||
            path === "/report-a-bug" ||
            path === "/report-bug";
          var delay = isInteractionCritical ? 40 : 320;
          setTimeout(loadHelpers, delay);
        }

        var currentPath = location.pathname.replace(/\/+$/, "") || "/";
        var needsEarlyHelpers =
          currentPath === "/chat" ||
          currentPath === "/settings" ||
          currentPath === "/report-a-bug" ||
          currentPath === "/report-bug";
        if (document.readyState === "complete" || (needsEarlyHelpers && document.readyState !== "loading")) {
          scheduleHelpers();
        } else if (needsEarlyHelpers) {
          document.addEventListener("DOMContentLoaded", scheduleHelpers, { once: true });
        } else {
          window.addEventListener("load", scheduleHelpers, { once: true });
        }
      })();
    </script>
